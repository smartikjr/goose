<!doctype html><html><head><meta charset="utf-8">
<style>
  body{margin:0;background:#0a0a0a;font-family:system-ui,sans-serif;padding:40px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;max-width:1200px;margin:0 auto;}
  .card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:20px;
    padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px;}
  .card h3{margin:0;color:#f2f2f2;font-size:20px;font-weight:700;}
  .card p{margin:0;color:#8a8a8a;font-size:13px;text-align:center;}
  svg.g{width:190px;height:210px;}
</style></head><body>

<svg style="display:none"><symbol id="goose" viewBox="0 0 220 240">
  <ellipse cx="104" cy="214" rx="60" ry="11" fill="rgba(0,0,0,0.4)"/>
  <g fill="#F5820A"><path d="M86 196 l-14 16 h26 z"/><path d="M116 196 l-14 16 h26 z"/></g>
  <path d="M46 150 q-20 -2 -26 10 q16 6 30 6 z" fill="#e9dfc8"/>
  <ellipse cx="100" cy="160" rx="60" ry="50" fill="#f2ead9"/>
  <ellipse cx="96" cy="172" rx="40" ry="30" fill="#f8f3e8"/>
  <path d="M112 138 q46 4 52 46 q-30 12 -58 -6 q-8 -24 6 -40 z" fill="#e6dbc0"/>
  <path d="M120 150 q30 6 38 30" stroke="#d9cba8" stroke-width="2.5" fill="none"/>
  <path d="M116 162 q28 6 36 26" stroke="#d9cba8" stroke-width="2.5" fill="none"/>
  <path d="M118 128 q6 -34 20 -52 q10 -14 26 -12 q-6 18 -10 30 q-6 20 -20 44 z" fill="#f2ead9"/>
  <circle cx="158" cy="60" r="26" fill="#f4ecdc"/>
  <circle cx="164" cy="54" r="4.2" fill="#1a1a1a"/><circle cx="165.6" cy="52.4" r="1.4" fill="#fff"/>
  <path d="M182 52 q30 3 32 12 q-2 9 -32 11 q-7 -12 0 -23 z" fill="#F5820A"/>
  <path d="M184 63 h28" stroke="#c96a00" stroke-width="1.6"/>
  <path d="M182 48 q8 -4 12 0 q-2 4 -12 4 z" fill="#e0700a"/>
</symbol></svg>

<div class="grid">

  <div class="card">
    <svg class="g" viewBox="0 0 220 240"><use href="#goose"/></svg>
    <h3>Базовый гусь</h3><p>талисман GOOSE — эталон стиля</p>
  </div>

  <div class="card">
    <svg class="g" viewBox="0 0 220 240"><use href="#goose"/>
      <!-- alarm clock -->
      <g transform="translate(24,150)">
        <circle cx="20" cy="24" r="18" fill="#161616" stroke="#F5820A" stroke-width="3"/>
        <path d="M6 9 l-6 -6 M34 9 l6 -6" stroke="#F5820A" stroke-width="3" stroke-linecap="round"/>
        <path d="M20 24 v-9 M20 24 l7 4" stroke="#F0C040" stroke-width="2.4" stroke-linecap="round"/>
      </g>
      <path d="M120 44 q10 -6 8 -16" stroke="#F5820A" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>
    <h3>Ранний гусь</h3><p>приходит раньше всех · будильник звенит</p>
  </div>

  <div class="card">
    <svg class="g" viewBox="0 0 220 240"><use href="#goose"/>
      <!-- top hat -->
      <g>
        <rect x="128" y="36" width="60" height="8" rx="4" fill="#141414"/>
        <rect x="138" y="6" width="40" height="34" rx="4" fill="#141414"/>
        <rect x="138" y="26" width="40" height="7" fill="#D4A017"/>
      </g>
      <!-- bow tie -->
      <path d="M120 120 l14 -8 v16 z M120 120 l-14 -8 v16 z" fill="#C0392B"/>
      <circle cx="120" cy="120" r="4" fill="#8f2a20"/>
    </svg>
    <h3>Вежливый гусь</h3><p>в цилиндре · приподнимает шляпу</p>
  </div>

  <div class="card">
    <svg class="g" viewBox="0 0 220 240"><use href="#goose"/>
      <!-- food bowl -->
      <g transform="translate(30,182)">
        <path d="M0 6 a30 12 0 0 0 60 0 z" fill="#222"/>
        <ellipse cx="30" cy="6" rx="30" ry="9" fill="#2b2b2b"/>
        <circle cx="18" cy="4" r="3" fill="#D4A017"/><circle cx="30" cy="7" r="3" fill="#F0C040"/><circle cx="42" cy="4" r="3" fill="#D4A017"/>
      </g>
      <!-- crumbs mid-air -->
      <circle cx="150" cy="120" r="3" fill="#F0C040"/><circle cx="140" cy="132" r="2.4" fill="#D4A017"/>
    </svg>
    <h3>Голодный гусь</h3><p>клюёт из миски · летят крошки</p>
  </div>

  <div class="card">
    <svg class="g" viewBox="0 0 220 240"><use href="#goose"/>
      <!-- two cards held -->
      <g transform="translate(96,150) rotate(-6)">
        <rect x="0" y="0" width="46" height="64" rx="7" fill="#fff" transform="rotate(-10)"/>
        <rect x="18" y="-4" width="46" height="64" rx="7" fill="#fff" transform="rotate(8)"/>
        <text x="24" y="20" font-family="system-ui" font-weight="800" font-size="15" fill="#15171a" transform="rotate(8)">2</text>
        <path d="M42 26 l4 6 -4 4 -4 -4 z" fill="#15171a" transform="rotate(8)"/>
        <text x="6" y="20" font-family="system-ui" font-weight="800" font-size="15" fill="#C0392B" transform="rotate(-10)">2</text>
        <path d="M12 30 a3 3 0 0 1 6 0 c0 3 -3 5 -3 5 c0 0 -3 -2 -3 -5 z" fill="#C0392B" transform="rotate(-10)"/>
      </g>
    </svg>
    <h3>Рука клуба</h3><p>держит карманную пару двоек 2♠2♥</p>
  </div>

  <div class="card">
    <svg class="g" viewBox="0 0 220 240"><use href="#goose"/>
      <!-- dealer visor -->
      <path d="M132 50 q26 -10 50 2 q4 10 -2 16 q-24 -10 -46 -2 q-6 -8 -2 -16 z" fill="#1a6b2e" opacity="0.92"/>
      <path d="M132 50 q26 -10 50 2" stroke="#0d3320" stroke-width="3" fill="none"/>
      <!-- chip stack -->
      <g transform="translate(150,176)">
        <ellipse cx="16" cy="24" rx="20" ry="7" fill="#C0392B"/>
        <ellipse cx="16" cy="18" rx="20" ry="7" fill="#161616" stroke="#F5820A" stroke-width="2"/>
        <ellipse cx="16" cy="12" rx="20" ry="7" fill="#D4A017"/>
      </g>
    </svg>
    <h3>Бонус дилера</h3><p>в козырьке · раздаёт фишки</p>
  </div>

</div>
</body></html>
